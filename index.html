<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Random Number</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="card shadow p-4 mx-auto mt-5" style="max-width: 400px;">
        <section class="content text-center">
            <h1>Guess The Number!</h1>
            <p>Guess a number between 1 and 10</p>
            <input type="text" id="guessInput" class="form-control mb-3" placeholder="Enter your guess">

            <div class="buttons d-flex justify-content-center gap-2">
                <button id="submitButton" class="btn btn-primary" onclick="submitBtn()">Submit</button>
                <button id="resetButton" class="btn btn-danger" onclick="resetBtn()">Reset</button>
            </div>

            <label id="result" class="mt-3 d-block"></label>
        </section>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
