<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Random Number</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="
    background-image: url('https://static.vecteezy.com/system/resources/previews/021/900/082/large_2x/random-number-gradient-pastel-math-background-vector.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
">
 
 <div class="d-flex justify-content-center align-items-center vh-100">
    <section class="card shadow p-4 border-0"
        style="
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
        ">

        <section class="content text-center">
            <h1>Guess The Number!</h1>
            <p>Guess a number between 1 and 10</p>

            <input type="text" id="guessInput" class="form-control mb-3" placeholder="Enter your guess">

            <div class="buttons d-flex justify-content-center gap-2">
                <button id="submitButton" class="btn btn-primary" onclick="submitBtn()">Submit</button>
                <button id="resetButton" class="btn btn-danger" onclick="resetBtn()">Reset</button>
            </div>

            <label id="result" class="mt-3 d-block"></label>
        </section>

    </section>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>

</body>
</html>
